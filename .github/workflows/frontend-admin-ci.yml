name: CI/CD Frontend Next.js

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend-admin/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend-admin/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend-admin/package-lock.json'

    - name: Installer les dépendances
      run: |
        cd frontend-admin
        npm ci

    - name: Vérifier le linter et build
      run: |
        cd frontend-admin
        npm run lint
        npm run build
