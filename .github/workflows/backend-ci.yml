name: CI/CD Backend Spring Boot

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code depuis ton dépôt GitHub
    - name: Récupérer le code
      uses: actions/checkout@v4

    # 2. Configuration de l'environnement Java (JDK 17)
    - name: Configurer le JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compilation et packaging en ignorant le test de contexte de base de données
    - name: Compiler et packager l'application (JAR)
      run: |
        cd backend
        mvn clean package -DskipTests