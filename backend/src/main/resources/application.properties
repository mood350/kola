spring.application.name=backend
server.port = 8081
server.server-header=

# POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kola_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# validate (et non update) : le schéma appartient désormais aux migrations
# Flyway (src/main/resources/db/migration). Hibernate se contente de vérifier
# au démarrage que la base correspond aux entités — tout écart fait échouer le
# boot au lieu de dériver en silence.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (no default — must be set in backend/.env, see .env.example)
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token-expiration=604800000

# MAIL CONFIGURATION (Nécessaire pour initialiser le bean JavaMailSender)
# Vous pouvez utiliser Mailtrap, Gmail, ou un serveur SMTP local (comme MailHog sur le port 1025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# L'adresse email d'expédition de l'application (utilisée dans @Value)
application.mail.from=noreply@kola.com

# L'URL du frontend pour l'activation du compte
application.mailing.frontend.activation-url=${FRONTEND_ACTIVATION_URL:http://localhost:3002/confirmation}

# ACTUATOR
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- FedaPay : encaissement Mobile Money -------------------------------
# Desactive par defaut : sans cle, l'application demarre normalement et seule
# la route /api/transactions/deposit/mobile-money repond « non configure ».
# L'URL par defaut est le BAC A SABLE — passer en production demande de
# changer explicitement FEDAPAY_BASE_URL et la cle, jamais par oubli.
fedapay.enabled=${FEDAPAY_ENABLED:false}
fedapay.base-url=${FEDAPAY_BASE_URL:https://sandbox-api.fedapay.com/v1}
fedapay.api-key=${FEDAPAY_API_KEY:}
fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:}
fedapay.callback-url=${FEDAPAY_CALLBACK_URL:http://localhost:3002/transactions}
fedapay.direct-charge=${FEDAPAY_DIRECT_CHARGE:false}
fedapay.payouts-enabled=${FEDAPAY_PAYOUTS_ENABLED:false}