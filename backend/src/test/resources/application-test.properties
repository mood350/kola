# In-memory database so the test suite runs without a local PostgreSQL.
spring.datasource.url=jdbc:h2:mem:dogaa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.security.jwt.secret=dGVzdC1zZWNyZXQtZm9yLWRvZ2FhLWJhY2tlbmQtdW5pdC10ZXN0cy0zMi1ieXRlcys=
app.security.jwt.issuer=dogaa
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=30d

app.security.auth.default-calling-code=228
app.security.auth.max-pin-attempts=5
app.security.auth.lock-duration=15m

app.security.otp.code-length=6
app.security.otp.ttl=5m
app.security.otp.max-attempts=5
app.security.otp.resend-cooldown=60s
app.security.otp.verification-token-ttl=15m

app.kyc.upload.storage-directory=target/test-kyc-documents

app.scheduling.enabled=true
app.scheduling.scheduled-transactions-cron=0 0 0 * * *
app.scheduling.credit-scoring-cron=0 30 0 * * *

management.endpoints.web.exposure.include=health,info
