spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Les tests montent leur schéma depuis les entités sur H2 : les migrations
# Flyway sont écrites en SQL PostgreSQL et ne s'appliquent qu'à la vraie base.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
# Clé de test, volontairement en dur pour que la suite tourne sans .env.
# Elle n'a aucune valeur en production : le profil principal exige
# JWT_SECRET_KEY depuis l'environnement, sans valeur par défaut.
application.security.jwt.secret-key=Y2VsbGhlbWF5YmV0cmFwYWxtb3N0ZWR1Y2F0aW9uZG9ua2V5c3RhdGlvbmNvbWJpbmVncm93ZGVhZGRpc2hibw==
application.security.jwt.expiration=28800000
application.security.jwt.refresh-token-expiration=604800000
application.mail.from=test@kola.local
application.mailing.frontend.activation-url=http://localhost:3000/activate
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
