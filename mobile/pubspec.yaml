name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  # --- Gestion d'état ---
  provider: ^6.1.2

  # --- Réseau / API (communication avec le backend Spring Boot) ---
  http: ^1.2.2

  # --- Stockage sécurisé (token JWT, données sensibles) ---
  flutter_secure_storage: ^9.2.2

  # --- Formatage devises (XOF) et dates ---
  intl: ^0.19.0

  # --- Typographie custom (optionnel, cohérence avec la landing page) ---
  google_fonts: ^6.2.1

  # --- Icônes SVG (optionnel) ---
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true