name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- Localisation française des composants Material (dates, pickers) ---
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  # --- Gestion d'état ---
  provider: ^6.1.2

  # --- Réseau / API (communication avec le backend Spring Boot) ---
  http: ^1.2.2

  # --- Stockage sécurisé (token JWT, données sensibles) ---
  flutter_secure_storage: ^9.2.2

  # --- Formatage devises (XOF) et dates ---
  intl: ^0.20.2

  # --- Typographie custom (optionnel, cohérence avec la landing page) ---
  google_fonts: ^6.2.1

  # --- Icônes SVG (optionnel) ---
  flutter_svg: ^2.0.10+1


  # --- Scan QR code (paiement marchand) ---
  mobile_scanner: ^6.0.2

  # --- Génération du QR de réception P2P ---
  qr_flutter: ^4.1.0

  # --- Verrouillage de l'app (empreinte / visage) ---
  local_auth: ^2.3.0

  # --- Préférences non sensibles (onboarding vu) ---
  shared_preferences: ^2.3.2

  # --- Envoi de pièces justificatives KYC ---
  file_picker: ^8.1.4

  # --- Choix d'un bénéficiaire dans le répertoire du téléphone ---
  flutter_contacts: ^1.1.9+2

  # --- Reçu de transfert au format PDF, partageable ---
  pdf: ^3.11.1
  printing: ^5.13.4

  # --- Skeleton loaders (états de chargement) ---
  shimmer: ^3.0.0

  # --- Transitions de page Material (système d'animation) ---
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/kola-logo-transparent.png
    - assets/onboarding/